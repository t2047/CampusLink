spring.application.name=CampusAgent

# ────────── Datasource from .env ──────────
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ────────── JPA / Hibernate ──────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ────────── JWT ──────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATON_MS}

# ────────── Agent 服务间认证 ──────────
# 留空时内部 Agent API 会拒绝所有请求，不影响普通 Web API。
app.agent.backend-shared-secret=${AGENT_BACKEND_SHARED_SECRET:}
app.agent.shared-secret=${AGENT_SHARED_SECRET:}
app.agent.lost-found-url=${LOST_FOUND_AGENT_URL:http://localhost:8083}

# ────────── Super Admin ──────────
app.super-admin.email=${SUPER_ADMIN_EMAIL}
app.super-admin.password=${SUPER_ADMIN_PASSWORD}

# ────────── Lost & Found object storage ──────────
app.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.storage.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.storage.bucket=${MINIO_BUCKET:campuslink}
app.storage.presigned-url-minutes=${MINIO_PRESIGNED_URL_MINUTES:15}

# ────────── Web client / uploads ──────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=52MB
spring.jpa.open-in-view=false
