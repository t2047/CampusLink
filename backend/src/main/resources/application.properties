# ─── Server ────────────────────────────────────────────────────────────
server.port=8080

# ─── Spring Application ────────────────────────────────────────────────
spring.application.name=campusagent
spring.main.banner-mode=off

# ─── Datasource (MySQL) ────────────────────────────────────────────────
# 优先使用 .env 中的 MYSQL_URL / MYSQL_USER / MYSQL_PASSWORD（完整 JDBC URL 含 createDatabaseIfNotExist）
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusagent}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQL_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA ───────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ────────── Facilities database isolation ──────────
# MySQL treats schema as database; this runs before Hibernate creates facility.* tables.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/facilities-schema.sql
spring.jpa.defer-datasource-initialization=false

# ─── JWT (用户会话) ──────────────────────────────────────────────────────
# 用户 Access Token（HS256，来自 .env → JWT_SECRET / JWT_EXPIRATION_MS）
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── Super Admin (首次启动初始化) ──────────────────────────────────────────
app.super-admin.email=${SUPER_ADMIN_EMAIL:admin@campuslink.com}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:Admin123!}

# ─── CORS ─────────────────────────────────────────────────────────────
# 允许的前端来源（逗号分隔，注意不要加空格；dev vite 3000/5173、后端自身 8080）
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5173}

# ─── Actuator (健康检查) ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# ─── Chat Core ─────────────────────────────────────────────────────────
# 编排层（Python LangGraph）地址
app.chat.orchestration-base-url=${ORCHESTRATION_BASE_URL:http://localhost:8000}

# 编排层共享密钥（HMAC 签名；来自 .env → AGENT_SHARED_SECRET）
app.chat.shared-secret=${AGENT_SHARED_SECRET:}

# Delegation Token（RS256）有效期，默认 30s
app.chat.delegation-token-ttl-seconds=${DELEGATION_TOKEN_TTL_SECONDS:30}

# RSA 密钥持久化目录（首次启动自动生成密钥对）
app.chat.delegation-key-dir=${DELEGATION_KEY_DIR:./keys}

# Agent 注册表（agentName → baseUrl）
app.chat.agents.mail-agent=${MAIL_AGENT_URL:http://localhost:8081}
app.chat.agents.facility-agent=${FACILITY_AGENT_URL:http://localhost:8082}
app.chat.agents.lost-found-agent=${LOSTFOUND_AGENT_URL:http://localhost:8083}
app.chat.agents.utility-tools=${UTILITY_TOOLS_URL:http://localhost:8090}

# ────────── Agent 服务间认证（后端直连通道，失物招领）──────────
# 留空时内部 Agent API 会拒绝所有请求，不影响普通 Web API。
app.agent.backend-shared-secret=${AGENT_BACKEND_SHARED_SECRET:}
app.agent.shared-secret=${AGENT_SHARED_SECRET:}
app.agent.lost-found-url=${LOST_FOUND_AGENT_URL:http://localhost:8083}

# ────────── Lost & Found object storage ──────────
app.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.storage.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.storage.bucket=${MINIO_BUCKET:campuslink}
app.storage.presigned-url-minutes=${MINIO_PRESIGNED_URL_MINUTES:15}

# ────────── Web client / uploads ──────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=52MB
spring.jpa.open-in-view=false

# ────────── Facilities MCP Server ──────────
spring.ai.mcp.server.name=campuslink-facilities
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.annotation-scanner.enabled=true
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
