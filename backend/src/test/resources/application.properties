# ========== Test Profile – H2 In-Memory Database ==========
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MYSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ────────── JPA / Hibernate ──────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Create the isolated Facilities schema before Hibernate DDL in H2.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/facilities-schema.sql
spring.jpa.defer-datasource-initialization=false

# ────────── JWT (hardcoded for tests) ──────────
app.jwt.secret=test-secret-key-for-unit-tests-only-do-not-use-in-production
app.jwt.expiration-ms=3600000
app.agent.backend-shared-secret=test-agent-backend-shared-secret-at-least-thirty-two-characters
app.cors.allowed-origins=http://localhost:5173

# ────────── Super Admin (test values) ──────────
app.super-admin.email=admin@campus.com
app.super-admin.password=Admin123!

# Keep MCP auto-configuration active in tests so annotated tools are verified at startup.
spring.ai.mcp.server.name=campuslink-facilities-test
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.annotation-scanner.enabled=true
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
