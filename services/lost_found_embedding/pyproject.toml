[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "campuslink-lost-found-embedding"
version = "0.1.0"
description = "CampusLink Lost & Found pretrained multimodal embedding service"
readme = "README_cn.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "numpy>=2.2,<3",
    "pillow>=11,<13",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sentence-transformers>=5.1,<6",
    "torch>=2.7,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8,<2",
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["lost_found_embedding"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
