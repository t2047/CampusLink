# Docker Compose — CampusLink（Chat Core + Lost & Found）
#
# Usage:
#   docker compose up -d                 # 基础设施：MySQL + MinIO
#   docker compose --profile agent up -d # 追加自研 Lost & Found Agent（api-server + lost-found-agent）
#   curl http://localhost:8080/actuator/health
#   curl http://localhost:8000/health

version: "3.9"

services:
  # ─── 基础设施 ────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-campuslink}
      MYSQL_DATABASE: campusLink_db
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-campuslink}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Chat Backend (Spring Boot + MVC + WebClient) ─────────
  # 融合自 feature/chatcore 的 chat-backend 与组员 api-server（同一份后端代码）
  chat-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/campusLink_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-campuslink}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-admin@campuslink.com}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-campuslink}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - AGENT_BACKEND_SHARED_SECRET=${AGENT_BACKEND_SHARED_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ─── Orchestration Layer (Python / FastAPI / LangGraph) ───
  orchestration:
    build:
      context: .
      dockerfile: agent/chat_core/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Docker 网络内用服务名互访（.env 中的 localhost 仅限本地联调）
      - TOKEN_SERVICE_URL=http://chat-backend:8080
      - TOKEN_SERVICE_JWKS_URL=http://chat-backend:8080/.well-known/jwks.json
      # Sprint 3：MCP Server 端点（服务名互访）
      - MAIL_AGENT_MCP_URL=http://mail-agent-mcp:8081/mcp/
      - FACILITY_AGENT_MCP_URL=http://facility-agent-mcp:8082/mcp/
      - LOSTFOUND_AGENT_MCP_URL=http://lostfound-agent-mcp:8083/mcp/
      - SKILL_AGENT_MCP_URL=http://skill-agent-mcp:8084/mcp/
      - UTILITY_TOOLS_MCP_URL=http://utility-mcp:8090/mcp/
    depends_on:
      - chat-backend
      - mail-agent-mcp
      - facility-agent-mcp
      - lostfound-agent-mcp
      - skill-agent-mcp
      - utility-mcp

  # ─── MCP Servers (Sprint 3) ─────────────────────────────────
  # Domain Agent 与 Utility 均暴露 MCP streamable HTTP 端点（/mcp/）。
  # 验签凭据：env_file(.env) 提供 TOKEN_SERVICE_JWKS_URL（RS256 验签必需）
  mail-agent-mcp:
    build:
      context: .
      dockerfile: agent/mcp_servers/Dockerfile
    env_file:
      - .env
    environment:
      - MCP_AGENT_NAME=mail-agent
      - TOKEN_SERVICE_JWKS_URL=http://chat-backend:8080/.well-known/jwks.json
    ports:
      - "8081:8081"
    depends_on:
      - chat-backend

  facility-agent-mcp:
    build:
      context: .
      dockerfile: agent/mcp_servers/Dockerfile
    env_file:
      - .env
    environment:
      - MCP_AGENT_NAME=facility-agent
      - TOKEN_SERVICE_JWKS_URL=http://chat-backend:8080/.well-known/jwks.json
    ports:
      - "8082:8082"
    depends_on:
      - chat-backend

  lostfound-agent-mcp:
    build:
      context: .
      dockerfile: agent/mcp_servers/Dockerfile
    env_file:
      - .env
    environment:
      - MCP_AGENT_NAME=lost-found-agent
      - TOKEN_SERVICE_JWKS_URL=http://chat-backend:8080/.well-known/jwks.json
    ports:
      - "8083:8083"
    depends_on:
      - chat-backend

  skill-agent-mcp:
    build:
      context: .
      dockerfile: agent/mcp_servers/Dockerfile
    env_file:
      - .env
    environment:
      - MCP_AGENT_NAME=skill-agent
      - TOKEN_SERVICE_JWKS_URL=http://chat-backend:8080/.well-known/jwks.json
    ports:
      - "8084:8084"
    depends_on:
      - chat-backend

  utility-mcp:
    build:
      context: .
      dockerfile: agent/mcp_servers/Dockerfile
    command: ["uvicorn", "mcp_servers.utility_server:app", "--host", "0.0.0.0", "--port", "8090"]
    env_file:
      - .env
    environment:
      - TOKEN_SERVICE_JWKS_URL=http://chat-backend:8080/.well-known/jwks.json
    ports:
      - "8090:8090"
    depends_on:
      - chat-backend

  # ─── 自研 Lost & Found Agent（组员实现，profile: agent）────────
  # 与 MCP lostfound-agent-mcp 并存（端口 8085，避免与 8083 冲突）
  lost-found-agent:
    profiles: ["agent"]
    build:
      context: ./agent/lost_found_agent
    environment:
      CAMPUS_API_URL: http://chat-backend:8080
      LOST_FOUND_AGENT_MODE: ${LOST_FOUND_AGENT_MODE:-auto}
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:-}
      AGENT_BACKEND_SHARED_SECRET: ${AGENT_BACKEND_SHARED_SECRET:-}
      LOST_FOUND_CONFIRMATION_SECRET: ${LOST_FOUND_CONFIRMATION_SECRET:-}
      LOST_FOUND_LLM_API_KEY: ${LOST_FOUND_LLM_API_KEY:-}
      LOST_FOUND_LLM_BASE_URL: ${LOST_FOUND_LLM_BASE_URL:-https://api.deepseek.com}
      LOST_FOUND_LLM_MODEL: ${LOST_FOUND_LLM_MODEL:-deepseek-v4-flash}
      LOST_FOUND_LLM_TIMEOUT_SECONDS: ${LOST_FOUND_LLM_TIMEOUT_SECONDS:-10}
    ports:
      - "8085:8085"
    depends_on:
      - chat-backend

volumes:
  mysql_data:
  minio_data:
