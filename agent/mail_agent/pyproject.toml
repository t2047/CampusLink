[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campuslink-mail-agent"
version = "0.2.0"
description = "Gmail-backed CampusLink mail REST service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.35,<1",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.140,<3",
    "google-auth-oauthlib>=1.2,<2",
    "google-auth-httplib2>=0.2,<1",
    # Identity: verifies the CampusLink user JWT (HS256, JWT_SECRET) and the
    # internal MCP-gateway token (HS256, MAIL_INTERNAL_SECRET/AGENT_SHARED_SECRET).
    "PyJWT>=2.8,<3",
    # LangChain mail agent (agent/mail_agent/mail_agent/agent.py).
    "langchain>=0.3,<2",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.2,<2",
    "langgraph>=0.2,<2",
    # Email classification (agent/mail_agent/ml).
    # numpy is pinned <2 so scipy wheels built against NumPy 1.x keep working.
    "joblib>=1.3,<2",
    "numpy>=1.26,<2",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.setuptools]
packages = ["mail_agent", "ml"]

[tool.setuptools.package-data]
ml = ["models/*.joblib", "models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# 保守规则集：只启用能直接反映代码缺陷的检查（未定义名 F821、未使用导入 F401、
# 语法/缩进/括号 E4/E7/E9 等），不启用风格类规则 —— 本模块从未按 ruff 风格规则
# 整理过（70+ 处 UP/SIM/DTZ 等风格建议），避免把既有风格问题当合并门禁。
select = ["E4", "E7", "E9", "F"]


