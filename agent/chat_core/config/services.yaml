# ─── Chat Core 编排层配置 ────────────────────────────────────────────────
# URL 支持 ${ENV_VAR:default} 占位符，加载时解析环境变量：
# - 本地联调：.env 中 MAIL_AGENT_URL=http://localhost:8081
# - Docker：  .env 或 compose 中 MAIL_AGENT_URL=http://mail-agent:8000
#
# Sprint 3（MCP）：mcp_url 为各 Agent/Utility 的 MCP streamable HTTP 端点，
# 编排层通过 MCP 协议调用（每 Agent 一个 invoke 工具 / utility 4 个工具）。

# 服务注册表
services:
  domain_agents:
    - name: mail-agent
      url: ${MAIL_AGENT_URL:http://127.0.0.1:8081}
      mcp_url: ${MAIL_AGENT_MCP_URL:http://127.0.0.1:8081/mcp/}
      timeout_ms: 30000
    - name: facility-agent
      url: ${FACILITY_AGENT_URL:http://127.0.0.1:8082}
      mcp_url: ${FACILITY_AGENT_MCP_URL:http://127.0.0.1:8082/mcp/}
      timeout_ms: 30000
    - name: lost-found-agent
      url: ${LOSTFOUND_AGENT_URL:http://127.0.0.1:8083}
      mcp_url: ${LOSTFOUND_AGENT_MCP_URL:http://127.0.0.1:8085/mcp/}
      timeout_ms: 30000

  utility_tools:
    - name: utility-tools
      url: ${UTILITY_TOOLS_URL:http://127.0.0.1:8090}
      mcp_url: ${UTILITY_TOOLS_MCP_URL:http://127.0.0.1:8090/mcp/}
      timeout_ms: 5000

  token_service:
    url: ${TOKEN_SERVICE_URL:http://127.0.0.1:8080}
    timeout_ms: 3000

# 安全（对齐通信安全说明文档）
security:
  mode: shared_secret              # Sprint 1-3; 生产切 mtls
  shared_secret: ${AGENT_SHARED_SECRET}
  time_window_seconds: 30
