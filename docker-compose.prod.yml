# ─── 生产 override：镜像引用（替代 build）─────────────────────────
# 用法（与基础 compose 合并，VM 只拉镜像不构建）：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --pull always
#
# 环境变量（.env 或部署时注入）：
#   REGISTRY  镜像仓库前缀，如 ghcr.io/<github-owner>（默认 ghcr.io/your-org）
#   TAG       镜像标签（默认 latest）
#
# mysql / minio 为官方镜像，保持不变。

services:
  chat-backend:
    build: !reset null
    image: ${REGISTRY:-ghcr.io/your-org}/campuslink-backend:${TAG:-latest}

  orchestration:
    build: !reset null
    image: ${REGISTRY:-ghcr.io/your-org}/campuslink-orchestration:${TAG:-latest}

  mail-agent-mcp:
    build: !reset null
    image: ${REGISTRY:-ghcr.io/your-org}/campuslink-mcp-servers:${TAG:-latest}

  mail-service:
    build: !reset null
    image: ${REGISTRY:-ghcr.io/your-org}/campuslink-mail-agent:${TAG:-latest}

  facility-agent-mcp:
    build: !reset null
    image: ${REGISTRY:-ghcr.io/your-org}/campuslink-mcp-servers:${TAG:-latest}

  utility-mcp:
    build: !reset null
    image: ${REGISTRY:-ghcr.io/your-org}/campuslink-mcp-servers:${TAG:-latest}

  lostfound-agent-mcp:
    build: !reset null
    image: ${REGISTRY:-ghcr.io/your-org}/campuslink-mcp-servers:${TAG:-latest}

  lost-found-agent:
    build: !reset null
    image: ${REGISTRY:-ghcr.io/your-org}/campuslink-lost-found-agent:${TAG:-latest}

  lost-found-mcp:
    build: !reset null
    image: ${REGISTRY:-ghcr.io/your-org}/campuslink-lost-found-agent:${TAG:-latest}

  # 政策 RAG 基础设施（multimodal profile）：
  # lost-found-embedding 需独立镜像（CD 构建 campuslink-lost-found-embedding）；
  # policy-index-builder 复用 mcp-servers 镜像（同 Dockerfile，含 policy_rag + llama-index）。
  # 生产环境移除宿主端口暴露：qdrant/embedding 仅容器内网互访（VM 上无需从宿主访问）。
  qdrant:
    ports: !reset null

  lost-found-embedding:
    build: !reset null
    image: ${REGISTRY:-ghcr.io/your-org}/campuslink-lost-found-embedding:${TAG:-latest}
    ports: !reset null

  policy-index-builder:
    build: !reset null
    image: ${REGISTRY:-ghcr.io/your-org}/campuslink-mcp-servers:${TAG:-latest}

  web:
    build: !reset null
    image: ${REGISTRY:-ghcr.io/your-org}/campuslink-web:${TAG:-latest}
