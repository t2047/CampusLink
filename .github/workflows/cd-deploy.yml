# ─── CampusLink CD：CI 构建镜像推 GHCR → SSH 到云 VM 拉取部署 ───
# 前提：
#   - VM 已按 DEPLOYMENT.md 初始化（/opt/campuslink 已克隆、.env 已配置
#     且含 REGISTRY=ghcr.io/<github-owner>）
#   - GHCR 包设为 public（Settings → Packages → Make public），VM 免登录拉取
#   - GitHub Secrets：
#       VM_HOST     VM IP 或域名
#       VM_USER     SSH 用户（root 或 sudo 用户）
#       VM_SSH_KEY  SSH 私钥
# 触发：推送 main 或手动（workflow_dispatch）
# 效果：VM 只需 docker pull，不在服务器上构建。
# 多模态模型运行时会额外占用约 2–3 GB 内存，生产 VM 建议至少 8 GB RAM。

name: CD Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGES: campuslink-backend campuslink-orchestration campuslink-mcp-servers campuslink-mail-agent campuslink-lost-found-agent campuslink-lost-found-embedding campuslink-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          set -e
          for svc in ${{ env.IMAGES }}; do
            case "$svc" in
              campuslink-backend)          dockerfile=backend/Dockerfile;          context=. ;;
              campuslink-orchestration)    dockerfile=agent/chat_core/Dockerfile;  context=. ;;
              campuslink-mcp-servers)      dockerfile=agent/mcp_servers/Dockerfile; context=. ;;
              campuslink-mail-agent)       dockerfile=agent/mail_agent/Dockerfile; context=./agent/mail_agent ;;
              campuslink-lost-found-agent) dockerfile=agent/lost_found_agent/Dockerfile; context=./agent ;;
              campuslink-lost-found-embedding) dockerfile=services/lost_found_embedding/Dockerfile; context=./services/lost_found_embedding ;;
              campuslink-web)              dockerfile=frontend_web/Dockerfile;     context=. ;;
            esac
            docker build -f "$dockerfile" \
              -t "$REGISTRY/$svc:latest" \
              -t "$REGISTRY/$svc:${{ steps.meta.outputs.tag }}" "$context"
            docker push "$REGISTRY/$svc:latest"
            docker push "$REGISTRY/$svc:${{ steps.meta.outputs.tag }}"
          done

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      CERT_DOMAIN: ${{ secrets.CERT_DOMAIN }}
      CERT_EMAIL: ${{ secrets.CERT_EMAIL }}
    steps:
      - name: Pull and restart on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: CERT_DOMAIN,CERT_EMAIL
          command_timeout: 20m
          script: |
            set -e
            cd /opt/campuslink
            git pull --ff-only
            # 兼容从 Windows 编辑器上传的 .env，避免 \r 被 shell 识别为命令。
            test -f ./.env || {
              echo "[campuslink] 拒绝部署：服务器缺少 /opt/campuslink/.env" >&2
              exit 1
            }
            sed -i 's/\r$//' ./.env
            if [ -z "${CERT_DOMAIN:-}" ] || [ -z "${CERT_EMAIL:-}" ]; then
              echo "[campuslink] 拒绝部署：GitHub Secrets 缺少 CERT_DOMAIN 或 CERT_EMAIL" >&2
              exit 1
            fi
            update_env() {
              key="$1"
              value="$2"
              escaped_value="$(printf '%s' "$value" | sed 's/[&|\\]/\\&/g')"
              if grep -q "^${key}=" ./.env; then
                sed -i "s|^${key}=.*|${key}=${escaped_value}|" ./.env
              else
                printf '\n%s=%s\n' "$key" "$value" >> ./.env
              fi
            }
            update_env CERT_DOMAIN "$CERT_DOMAIN"
            update_env CERT_EMAIL "$CERT_EMAIL"
            set -a
            . ./.env
            set +a
            if [ -z "${CERT_DOMAIN:-}" ] || [ -z "${CERT_EMAIL:-}" ] \
              || [ "$CERT_DOMAIN" = "campuslink.local" ]; then
              echo "[campuslink] 拒绝部署：服务器 .env 必须先配置正式 CERT_DOMAIN 和 CERT_EMAIL" >&2
              exit 1
            fi
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --profile agent --profile multimodal \
              up -d --pull always --wait --wait-timeout 900
            ./deploy/bootstrap_https.sh
            docker image prune -f
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --profile agent --profile multimodal ps
