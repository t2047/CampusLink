name: Backend CI/CD (SAST + Build + Test + OWASP)

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

defaults:
  run:
    working-directory: backend

jobs:

  # ─────────────────── SAST ───────────────────
  sast:
    name: SAST - CodeQL & SpotBugs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Static Application Security Testing - CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: java
          source-root: backend

      - name: Build with Maven (skip tests for SAST)
        run: mvn compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      # SpotBugs (FindBugs successor)
      - name: Run SpotBugs
        run: mvn spotbugs:check || true
        continue-on-error: true

  # ─────────────────── BUILD + UNIT TEST ───────────────────
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    needs: sast
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: campusLink_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}

      - name: Build & Run Tests
        env:
          MYSQL_URL: jdbc:mysql://localhost:3306/campusLink_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          MYSQL_USER: root
          MYSQL_PASSWORD: testpass
        run: mvn verify

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: backend/target/surefire-reports/

  # ─────────────────── OWASP DEPENDENCY CHECK ───────────────────
  dependency-scan:
    name: OWASP Dependency Check (SCA)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 || true
        continue-on-error: true

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html

  # ─────────────────── DYNAMIC SCAN (DAST) ───────────────────
  dast:
    name: DAST - OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Start Application
        env:
          MYSQL_URL: jdbc:mysql://localhost:3306/campusLink_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          MYSQL_USER: root
          MYSQL_PASSWORD: testpass
        run: |
          mvn spring-boot:run &
          sleep 30
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/auth/login || true

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
        continue-on-error: true

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: zap.out
