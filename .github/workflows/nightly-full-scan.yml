# ─── 每日凌晨 02:00 UTC (北京时间 10:00) ────────────────────
# 全量深度扫描: SpotBugs(Max/Medium) + OWASP Dependency Check + DAST(ZAP)
# 耗时目标: 30-60 分钟, 可接受

name: Nightly - Full SAST + SCA + DAST

on:
  schedule:
    # 每天 UTC 02:00 (北京时间 10:00)
    - cron: '0 2 * * *'
  # 也允许手动触发
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

defaults:
  run:
    working-directory: backend

# 防止多个 nightly 并行（手动触发 + cron 同时撞上）
concurrency:
  group: nightly-full-scan
  cancel-in-progress: false

jobs:

  # ── SAST (全量深度) ──
  sast-full:
    name: SAST - CodeQL & SpotBugs (Full)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          source-root: backend

      - name: Build with Maven
        run: mvn compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # SpotBugs full mode: Max effort, Medium threshold
      - name: Run SpotBugs (full)
        run: mvn spotbugs:check -Pfull-sast || true

      - name: Upload SpotBugs XML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report-full
          path: backend/target/spotbugsXml.xml
          retention-days: 30

  # ── Build & Unit Test ──
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    needs: sast-full
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: campusLink_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build & Run Tests
        env:
          MYSQL_URL: jdbc:mysql://localhost:3306/campusLink_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          MYSQL_USER: root
          MYSQL_PASSWORD: testpass
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATON_MS: "86400000"
        run: mvn test -Pfull-sast

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/target/surefire-reports/
          retention-days: 30

  # ── OWASP Dependency Check (SCA, 全量) ──
  dependency-scan:
    name: OWASP Dependency Check (SCA)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Cache NVD data to avoid re-downloading 200+ MB each run
      - name: Cache OWASP NVD data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          # 每天换一次 key; 24h 后重建缓存刷新漏洞库
          key: owasp-nvd-${{ github.run_date }}
          restore-keys: owasp-nvd-

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DnvdApiKey=$NVD_API_KEY \
            -Pfull-sast || true

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 30

  # ── DAST (OWASP ZAP) ──
  dast:
    name: DAST - OWASP ZAP Full Scan
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: campusLink_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Start Application & Wait for Readiness
        env:
          MYSQL_URL: jdbc:mysql://localhost:3306/campusLink_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          MYSQL_USER: root
          MYSQL_PASSWORD: testpass
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATON_MS: "86400000"
        run: |
          mvn spring-boot:run -Pfull-sast &
          # Health-check poll: wait up to 90s for app to respond
          for i in $(seq 1 18); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/auth/login || true)
            if [ "$HTTP_CODE" != "000" ]; then
              echo "App ready, HTTP $HTTP_CODE"
              break
            fi
            echo "Waiting... ($((i*5))s)"
            sleep 5
          done

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap.out
          retention-days: 30
