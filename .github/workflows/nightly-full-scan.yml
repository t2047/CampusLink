# ─── 每日凌晨 04:00 ───────────────────
# 全量深度扫描: SpotBugs(Max/Medium) + OWASP Dependency Check + DAST(ZAP)
# 耗时目标: 30-60 分钟, 可接受

name: Nightly - Full SAST + SCA + DAST

on:
  schedule:
    # 每天 04:00 、
    - cron: '0 20 * * *'
  # 也允许手动触发
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

defaults:
  run:
    working-directory: backend

# 防止多个 nightly 并行（手动触发 + cron 同时撞上）
concurrency:
  group: nightly-full-scan
  cancel-in-progress: false

jobs:

  # ── SAST (全量深度) ──
  sast-full:
    name: SAST - CodeQL & SpotBugs (Full)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          source-root: backend

      - name: Build with Maven
        run: mvn compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      # SpotBugs full mode: Max effort, Medium threshold
      - name: Run SpotBugs (full)
        run: mvn spotbugs:check -Pfull-sast || true

      - name: Upload SpotBugs XML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report-full
          path: backend/target/spotbugsXml.xml
          retention-days: 30

  # ── Build & Unit Test ──
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    needs: sast-full
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: campusLink_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build & Run Tests
        env:
          MYSQL_URL: jdbc:mysql://localhost:3306/campusLink_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          MYSQL_USER: root
          MYSQL_PASSWORD: testpass
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATON_MS: "86400000"
        run: mvn test -Pfull-sast

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/target/surefire-reports/
          retention-days: 30

  # ── OWASP Dependency Check (SCA, 全量) ──
  dependency-scan:
    name: OWASP Dependency Check (SCA)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Cache NVD data to avoid re-downloading 200+ MB each run
      - name: Cache OWASP NVD data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          # 每天换一次 key; 24h 后重建缓存刷新漏洞库
          key: owasp-nvd-${{ github.run_date }}
          restore-keys: owasp-nvd-

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DnvdApiKey=$NVD_API_KEY \
            -Pfull-sast || true

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 30

  # ── DAST (OWASP ZAP) ──
  dast:
    name: DAST - OWASP ZAP Full Scan
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: campusLink_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Start Application & Wait for Readiness
        env:
          MYSQL_URL: jdbc:mysql://localhost:3306/campusLink_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          MYSQL_USER: root
          MYSQL_PASSWORD: testpass
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATON_MS: "86400000"
        run: |
          mvn spring-boot:run -Pfull-sast &
          # Health-check poll: wait up to 90s for app to respond
          for i in $(seq 1 18); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/auth/login || true)
            if [ "$HTTP_CODE" != "000" ]; then
              echo "App ready, HTTP $HTTP_CODE"
              break
            fi
            echo "Waiting... ($((i*5))s)"
            sleep 5
          done
          if [ "$HTTP_CODE" = "000" ]; then
            echo "::error::Application failed to start within 90s"
            exit 1
          fi

      # 注册一次性 DAST 测试账号并获取 JWT（/api/auth/register 为 permitAll，
      # 不依赖默认 super admin 密码；email 含 run id 保证唯一）
      - name: Obtain DAST scan token
        id: dast-auth
        run: |
          EMAIL="zap-scan-${GITHUB_RUN_ID}@campuslink.test"
          PASSWORD="ZapScanPass-${GITHUB_RUN_ID}!"
          echo "::add-mask::$PASSWORD"
          RESP=$(curl -s -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\"}")
          TOKEN=$(echo "$RESP" | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Failed to obtain DAST token: $RESP"
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: OWASP ZAP Baseline Scan (authenticated)
        env:
          ZAP_TOKEN: ${{ steps.dast-auth.outputs.token }}
        run: |
          # token 会出现在 docker run 命令行日志中，先打码隐藏
          echo "::add-mask::$ZAP_TOKEN"
          # 直接以 docker 方式运行 zap-baseline.py（不再用 action-baseline：
          # 其默认 allow_issue_writing=true 需 issues:write 权限导致 403，且无法注入动态 token）。
          # 通过 ZAP Replacer(REQ_HEADER) 给所有请求注入 Authorization: Bearer <token>，
          # 使扫描不再全部 401；-c 加载 rules（忽略 API 噪音告警）；-I 让 WARN 不产生非零退出码。
          set +e
          docker run --rm -v "$PWD:/zap/wrk/:rw" --network=host \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 \
            -J report_json.json -w report_md.md -r report_html.html \
            -a -j -I -c .zap/rules.tsv \
            -z "-config replacer.full_list(0).description=ci-auth \
                -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).regex=false \
                -config replacer.full_list(0).matchtype=REQ_HEADER \
                -config replacer.full_list(0).matchstr=Authorization \
                -config replacer.full_list(0).replacement='Bearer ${ZAP_TOKEN}' \
                -config replacer.full_list(0).url=.*"
          ZAP_EXIT=$?
          set -e
          # 门禁（与 action-baseline 默认 fail_on_issues=true 一致）：
          # exit 1 = 存在 FAIL 级告警 → job 失败，禁止带高危告警合入；
          # exit 3 = 扫描未完成（技术失败）→ job 失败。
          # WARN 告警已被 -I 抑制，不会产生非零退出码（故无 exit 2 分支）。
          if [ "$ZAP_EXIT" -eq 1 ] || [ "$ZAP_EXIT" -eq 3 ]; then
            if [ "$ZAP_EXIT" -eq 1 ]; then
              echo "::error::ZAP baseline scan found FAIL-level alerts (exit code 1)"
            else
              echo "::error::ZAP baseline scan failed to complete (exit code 3)"
            fi
            exit 1
          fi
          echo "ZAP baseline scan finished (exit code $ZAP_EXIT: 0=clean)"

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_md.md
            report_json.json
            report_html.html
          retention-days: 30
