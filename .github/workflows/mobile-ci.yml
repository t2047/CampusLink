name: Android - Core Chat CI

on:
  push:
    branches: [main, develop, feature/mobile-core-chat-kotlin]
    paths:
      - 'frontend_mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend_mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: android-core-chat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-apk:
    name: Android Lint、测试与 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装 Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: 静态检查、单元测试与构建
        run: ./gradlew detekt lintDemoDebug testDemoDebugUnitTest assembleDemoDebug --stacktrace
      - name: 准备 APK
        run: cp app/build/outputs/apk/demo/debug/app-demo-debug.apk app/build/outputs/apk/CampusLink-core-chat-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CampusLink-core-chat-demo
          path: frontend_mobile/app/build/outputs/apk/CampusLink-core-chat-demo.apk
          retention-days: 14
          if-no-files-found: error

  codeql:
    name: Android Java/Kotlin CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          source-root: frontend_mobile
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装 Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: 编译 Android
        working-directory: frontend_mobile
        run: ./gradlew assembleDemoDebug
      - uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Android 依赖审查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
