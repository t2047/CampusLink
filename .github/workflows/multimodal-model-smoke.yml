name: 手动 - Lost & Found 真实多模态模型验证

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model-smoke:
    name: 固定 revision 模型加载与离线评估
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/lost_found_embedding
    env:
      RUN_REAL_MULTIMODAL_TESTS: "1"
      LOST_FOUND_CROSS_MODAL_ENABLED: "off"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 缓存固定 revision 模型
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: lf-models-${{ runner.os }}-${{ hashFiles('services/lost_found_embedding/uv.lock') }}
      - name: 安装锁定依赖
        run: python -m pip install uv==0.12.3 && uv sync --frozen --all-extras
      - name: 验证模型可重复性与区分能力
        run: uv run pytest tests/test_real_models.py -q
      - name: 执行 30 组离线 Recall@5 评估
        run: uv run python evaluation/evaluate_models.py --output evaluation-result.json
      - name: 上传评估结果
        uses: actions/upload-artifact@v4
        with:
          name: lost-found-multimodal-evaluation
          path: services/lost_found_embedding/evaluation-result.json
          retention-days: 30
