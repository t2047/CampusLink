# ─── PR / Push: 增量快速扫描 ─────────────────────────────────
# 执行测试、构建、npm 审计、依赖审查、CodeQL 与 SpotBugs(Default/High)，跳过 OWASP 和 DAST
# 耗时目标: 5-8 分钟

name: PR - Fast SAST + Build + Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend_web/**'
      - 'agent/**'
      - 'docs/lost-found/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'README.md'
      - 'README_cn.md'
      - '.github/workflows/pr-fast-scan.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend_web/**'
      - 'agent/**'
      - 'docs/lost-found/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'README.md'
      - 'README_cn.md'
      - '.github/workflows/pr-fast-scan.yml'
  # 允许手动触发快速 SAST 扫描
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

concurrency:
  group: pr-fast-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:

  chat-core-test:
    name: Chat Core Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent/chat_core
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/chat_core/pyproject.toml
      - name: Install Chat Core dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Chat Core tests
        run: pytest -q

  agent-quality:
    name: Agent Lint, Test & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent/lost_found_agent
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/lost_found_agent/uv.lock
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy lost_found_agent tests
      - name: Pytest
        run: uv run pytest
      - name: Bandit
        run: uv run bandit -r lost_found_agent -x tests -q
      - name: Python dependency audit
        run: uv run pip-audit
      - name: Build non-root Agent image
        # Dockerfile 的 COPY 路径（lost_found_agent/*、mcp_servers/）以 agent/ 为 context
        working-directory: agent
        run: docker build -f lost_found_agent/Dockerfile -t campuslink-lost-found-agent:${{ github.sha }} .

  agent-codeql:
    name: Agent CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize Python CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          source-root: agent/lost_found_agent
      - name: Perform Python CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend_web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ── SAST (快速模式) ──
  sast-fast:
    name: SAST - CodeQL & SpotBugs (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          source-root: backend

      - name: Build with Maven
        run: mvn compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      # SpotBugs fast mode: Default effort, High threshold only
      - name: Run SpotBugs (fast)
        run: mvn spotbugs:check -Pfast-sast

      - name: Upload SpotBugs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report-fast
          path: backend/target/spotbugsXml.xml
          retention-days: 7

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ── Build & Unit Test ──
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: sast-fast
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: campusLink_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build & Run Tests
        env:
          MYSQL_URL: jdbc:mysql://localhost:3306/campusLink_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          MYSQL_USER: root
          MYSQL_PASSWORD: testpass
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATON_MS: "86400000"
        # mvn test: 只 compile + test，不触发 verify 阶段的 SpotBugs/OWASP
        run: mvn test -Pfast-sast

      - name: Verify Docker Compose configuration
        working-directory: ${{ github.workspace }}
        run: |
          # .env 被 gitignore，CI checkout 后不存在；compose 的 env_file: .env 按
          # 仓库根解析，先生成一份（默认占位值仅用于配置校验，不用于真实运行）
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile agent config --quiet

      - name: Build non-root backend image
        working-directory: ${{ github.workspace }}
        # backend/Dockerfile 的 COPY 路径（backend/*）以仓库根为 context（与 compose chat-backend 一致）
        run: docker build -f backend/Dockerfile -t campuslink-api-server:${{ github.sha }} .

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/target/surefire-reports/
          retention-days: 7
