# ─── PR / Push: 增量快速扫描 ─────────────────────────────────
# 执行测试、构建、npm 审计、依赖审查、CodeQL 与 SpotBugs(Default/High)，跳过 OWASP 和 DAST
# 耗时目标: 5-8 分钟

name: PR - Fast SAST + Build + Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend_web/**'
      - 'docker-compose.yml'
      - '.github/workflows/pr-fast-scan.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend_web/**'
      - 'docker-compose.yml'
      - '.github/workflows/pr-fast-scan.yml'
  # 允许手动触发快速 SAST 扫描
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

concurrency:
  group: pr-fast-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend_web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ── SAST (快速模式) ──
  sast-fast:
    name: SAST - CodeQL & SpotBugs (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          source-root: backend

      - name: Build with Maven
        run: mvn compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      # SpotBugs fast mode: Default effort, High threshold only
      - name: Run SpotBugs (fast)
        run: mvn spotbugs:check -Pfast-sast

      - name: Upload SpotBugs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report-fast
          path: backend/target/spotbugsXml.xml
          retention-days: 7

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ── Build & Unit Test ──
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: sast-fast
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: campusLink_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build & Run Tests
        env:
          MYSQL_URL: jdbc:mysql://localhost:3306/campusLink_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          MYSQL_USER: root
          MYSQL_PASSWORD: testpass
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATON_MS: "86400000"
        # mvn test: 只 compile + test，不触发 verify 阶段的 SpotBugs/OWASP
        run: mvn test -Pfast-sast

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/target/surefire-reports/
          retention-days: 7
