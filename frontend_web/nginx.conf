# CampusLink 前端 nginx：静态资源 + /api 反向代理（同源部署）
# chat-backend 服务名由 docker compose 网络提供；SSE 流需关闭 buffering
# HTTPS：证书由 certbot webroot 模式签发到 /etc/letsencrypt（compose 挂载卷）

# ACME 挑战目录（certbot webroot 写入；先于 80 静态托管生效）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # certbot webroot 验证（证书签发/续期）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SPA 路由回退（/chat、/admin/*、/lost-found/* 等）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（含 SSE：/api/chat/stream、/api/chat/resume）
    location /api/ {
        proxy_pass http://chat-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# HTTPS（证书存在时启用；未签发前该 server 直接拒绝，不影响 80 访问）
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/${CERT_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${CERT_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://chat-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
