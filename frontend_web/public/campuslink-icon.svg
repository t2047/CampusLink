<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Glow halo -->
  <ellipse cx="32" cy="34" rx="22" ry="18" fill="url(#glow)"/>
  <!-- Graduation cap body -->
  <g filter="url(#shadow)">
    <path d="M32 12 L10 24 L32 36 L54 24 Z" fill="url(#cap)"/>
    <!-- Cap highlight -->
    <path d="M32 12 L10 24 L32 36 L54 24 Z" fill="none" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.5"/>
    <!-- Tassel attachment -->
    <circle cx="50" cy="23" r="2.2" fill="#f59e0b"/>
    <!-- Tassel -->
    <path d="M50 25 L50 40" stroke="url(#band)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M47 38 Q50 42 53 38" fill="url(#band)" stroke="none"/>
    <!-- Cap band detail -->
    <path d="M32 15 L14 24 L32 33 L50 24 Z" fill="none" stroke="#c4b5fd" stroke-width="1" stroke-opacity="0.6"/>
    <!-- Base band -->
    <path d="M20 24 Q32 30 44 24" fill="none" stroke="#c4b5fd" stroke-width="1.2" stroke-opacity="0.8"/>
    <!-- Book under cap -->
    <g transform="translate(18 38)">
      <rect x="0" y="0" width="28" height="18" rx="2" fill="url(#cap)"/>
      <rect x="2" y="2" width="24" height="14" rx="1.5" fill="#ede9fe" opacity="0.9"/>
      <line x1="14" y1="2" x2="14" y2="16" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.6"/>
      <line x1="5" y1="6" x2="12" y2="6" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.4"/>
      <line x1="5" y1="9" x2="12" y2="9" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.4"/>
      <line x1="5" y1="12" x2="12" y2="12" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.4"/>
      <line x1="16" y1="6" x2="23" y2="6" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.4"/>
      <line x1="16" y1="9" x2="23" y2="9" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.4"/>
      <line x1="16" y1="12" x2="23" y2="12" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.4"/>
    </g>
    <!-- Sparkle stars -->
    <path d="M12 18 L13 16 L14 18 L13 20 Z" fill="#fbbf24" opacity="0.9"/>
    <path d="M54 16 L54.8 14.5 L55.6 16 L54.8 17.5 Z" fill="#fbbf24" opacity="0.8"/>
  </g>
</svg>
